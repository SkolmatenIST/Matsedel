<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Veckans Matsedel</title>
    <style>
        /* DESIGN ANPASSAD FÖR TV- OCH INFOSKÄRMAR */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #2c3e50;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: #1a3a5f;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 5px solid #4a90e2;
            padding-bottom: 15px;
            width: 100%;
            text-align: center;
            font-weight: 700;
        }

        /* MATSEDELNS LAYOUT (5 ENKLA, TYDLIGA BLOCK UNDER VARANDRA) */
        #matsedel-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .dag-kort {
            background: #fdfdfd;
            padding: 25px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            border-left: 8px solid #4a90e2;
            border-top: 1px solid #eee;
            border-right: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .dag-namn {
            font-size: 2.2rem;
            font-weight: bold;
            color: #1a3a5f;
            min-width: 220px;
            text-transform: capitalize;
        }

        .mat-text {
            font-size: 1.8rem;
            color: #444;
            line-height: 1.5;
            flex-grow: 1;
            font-weight: 500;
        }

        .laddar {
            font-size: 2rem;
            color: #7f8c8d;
            margin-top: 150px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>Veckans Matsedel</h1>
    <div id="matsedel-container">
        <div class="laddar">Hämtar matsedel...</div>
    </div>

    <script>
        // 1. KLISTRA IN DIN RIKTIGA RSS-LÄNK FRÅN SKOLMATEN HÄR:
        const RSS_URL = 'KLISTRA_IN_DIN_SKOLMATEN_RSS_LÄNK_HÄR';

        const dagarOrdning = ['måndag', 'tisdag', 'onsdag', 'torsdag', 'fredag'];

        // Vi använder en stabil, öppen proxy för att läsa RSS-datan utan CORS-problem på GitHub
        const proxyUrl = `https://allorigins.win{encodeURIComponent(RSS_URL)}`;

        fetch(proxyUrl)
            .then(response => {
                if (response.ok) return response.json();
                throw new Error('Nätverksfel vid hämtning.');
            })
            .then(data => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                const items = Array.from(xmlDoc.getElementsByTagName("item"));
                
                const container = document.getElementById('matsedel-container');
                container.innerHTML = ''; // Ta bort "Hämtar..."

                // Sortera så att Måndag kommer först och Fredag sist
                items.sort((a, b) => {
                    const titleA = a.getElementsByTagName("title")[0]?.textContent.toLowerCase() || "";
                    const titleB = b.getElementsByTagName("title")[0]?.textContent.toLowerCase() || "";
                    let dagA = dagarOrdning.findIndex(d => titleA.includes(d));
                    let dagB = dagarOrdning.findIndex(d => titleB.includes(d));
                    return dagA - dagB;
                });

                // Filtrera ut helgdagar och ta bara de 5 första arbetsdagarna
                const arbetsdagar = items.filter(item => {
                    const title = item.getElementsByTagName("title")[0]?.textContent.toLowerCase() || "";
                    return dagarOrdning.some(d => title.includes(d));
                }).slice(0, 5);

                // Bygg menykorten på skärmen
                arbetsdagar.forEach(item => {
                    const rawTitle = item.getElementsByTagName("title")[0]?.textContent || "";
                    const descNode = item.getElementsByTagName("description")[0] || item.getElementsByTagName("summary")[0];
                    const rawDesc = descNode ? descNode.textContent : "Ingen meny registrerad";

                    const kort = document.createElement('div');
                    kort.className = 'dag-kort';

                    // Snygga till så det bara står namnet på veckodagen
                    let rensadTitel = rawTitle;
                    dagarOrdning.forEach(d => {
                        if(rawTitle.toLowerCase().includes(d)) {
                            rensadTitel = d;
                        }
                    });

                    kort.innerHTML = `
                        <div class="dag-namn">${rensadTitel}</div>
                        <div class="mat-text">${rawDesc}</div>
                    `;
                    container.appendChild(kort);
                });
            })
            .catch(err => {
                document.getElementById('matsedel-container').innerHTML = 
                    `<div class="laddar" style="color:#c0392b; font-weight:bold;">Kunde inte ladda matsedeln automatiskt just nu.</div>`;
                console.error(err);
            });
    </script>
</body>
</html>
