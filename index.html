<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Veckans Matsedel</title>
    <style>
        /* DESIGN ANPASSAD FÖR TV- OCH INFOSKÄRMAR */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #2c3e50;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: #1a3a5f;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 5px solid #4a90e2;
            padding-bottom: 15px;
            width: 100%;
            text-align: center;
            font-weight: 700;
        }

        #matsedel-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .dag-kort {
            background: #fdfdfd;
            padding: 25px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            border-left: 8px solid #4a90e2;
            border-top: 1px solid #eee;
            border-right: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .dag-namn {
            font-size: 2.2rem;
            font-weight: bold;
            color: #1a3a5f;
            min-width: 220px;
            text-transform: capitalize;
        }

        .mat-text {
            font-size: 1.8rem;
            color: #444;
            line-height: 1.5;
            flex-grow: 1;
            font-weight: 500;
        }

        .laddar {
            font-size: 2rem;
            color: #7f8c8d;
            margin-top: 150px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>Veckans Matsedel</h1>
    <div id="matsedel-container">
        <div class="laddar">Hämtar matsedel...</div>
    </div>

    <script>
        // 1. KLISTRA IN DIN RSS-LÄNK FRÅN SKOLMATEN HÄR:
        const RSS_URL = 'https://skolmaten.se/api/4/rss/week/snosatraskolan?locale=sv';

        const dagarOrdning = ['måndag', 'tisdag', 'onsdag', 'torsdag', 'fredag'];

        // Vi använder AllOrigins öppna raw-api för att hämta datan stabilt
        const proxyUrl = `https://allorigins.win{encodeURIComponent(RSS_URL)}`;

        // Funktion för att på ett säkert sätt rensa bort CDATA och HTML-taggar ur RSS-texten
        function stadaText(str) {
            if (!str) return "Ingen meny registrerad";
            let rensad = str.replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '\$1');
            rensad = rensad.replace(/<[^>]*>/g, ' ');
            rensad = rensad.replace(/\s+/g, ' ');
            return rensad.trim();
        }

        fetch(proxyUrl)
            .then(response => {
                if (response.ok) return response.text();
                throw new Error('Nätverksfel vid hämtning.');
            })
            .then(str => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(str, "text/xml");
                const items = Array.from(xmlDoc.getElementsByTagName("item"));
                
                const container = document.getElementById('matsedel-container');
                container.innerHTML = ''; 

                // 1. SÄKER HÄMTNING AV TEXT: Vi plockar ut rå-HTML ur XML-taggarna för att förhindra krascher
                const formateradePoster = items.map(item => {
                    const titleTag = item.getElementsByTagName("title")[0];
                    const descTag = item.getElementsByTagName("description")[0] || item.getElementsByTagName("summary")[0];
                    
                    return {
                        title: titleTag ? stadaText(titleTag.innerHTML) : "",
                        description: descTag ? stadaText(descTag.innerHTML) : "Ingen meny registrerad"
                    };
                });

                // 2. Filtrera ut så att vi bara sparar de faktiska arbetsdagarna
                const arbetsdagar = formateradePoster.filter(post => {
                    return dagarOrdning.some(d => post.title.toLowerCase().includes(d));
                });

                // 3. Sortera listan kronologiskt (Måndag till Fredag)
                arbetsdagar.sort((a, b) => {
                    let indexA = dagarOrdning.findIndex(d => a.title.toLowerCase().includes(d));
                    let indexB = dagarOrdning.findIndex(d => b.title.toLowerCase().includes(d));
                    return indexA - indexB;
                });

                // 4. Begränsa till max 5 arbetsdagar
                const veckansDagar = arbetsdagar.slice(0, 5);

                // 5. Bygg menykorten på skärmen
                veckansDagar.forEach(post => {
                    let rensadTitel = post.title;
                    dagarOrdning.forEach(d => {
                        if(post.title.toLowerCase().includes(d)) {
                            rensadTitel = d;
                        }
                    });

                    const formateradDag = rensadTitel.charAt(0).toUpperCase() + rensadTitel.slice(1);

                    const kort = document.createElement('div');
                    kort.className = 'dag-kort';
                    kort.innerHTML = `
                        <div class="dag-namn">${formateradDag}</div>
                        <div class="mat-text">${post.description}</div>
                    `;
                    container.appendChild(kort);
                });

                if (veckansDagar.length === 0) {
                    container.innerHTML = `<div class="laddar">Hittade inga giltiga matsedlar i flödet just nu.</div>`;
                }
            })
            .catch(err => {
                document.getElementById('matsedel-container').innerHTML = 
                    `<div class="laddar" style="color:#c0392b; font-weight:bold;">Kunde inte hämta matsedeln från Skolmaten för tillfället.</div>`;
                console.error(err);
            });
    </script>
</body>
</html>
