<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Veckans Matsedel</title>
    <style>
        /* Tvingar sidan att fylla TV-skärmen utan scrollister */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* Detta är ramen som klipper bort Skolmatens menyer och reklam */
        .matsedels-ram {
            position: absolute;
            top: -140px;    /* Knuffar upp sidan så att Skolmatens toppmeny och logga döljs */
            left: -10px;    /* Justerar bort vänstermarginalen */
            width: 102%;    /* Gör fönstret lite bredare än skärmen för att dölja sidofält */
            height: 130%;   /* Gör fönstret extra högt så att sidan inte tar slut i botten */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            
            /* HÄR STYR VI SKÄRPAN OCH STORLEKEN PÅ TEXTEN 
               1.25 betyder 125% zoom vilket gör texten stor och tydlig på håll */
            transform: scale(1.25);        
            transform-origin: top center;  /* Zoomar snyggt utifrån mitten-toppen */
        }
    </style>
</head>
<body>

    <div class="matsedels-ram">
        <!-- 1. BYT UT WEBBADRESSEN NEDAN TILL DIN SKOLAS VANLIGA SKOLMATEN-SIDA -->
        <!-- Exempel: https://skolmaten.se -->
        <iframe src="https://skolmaten.se/snosatraskolan"></iframe>
    </div>

</body>
</html>
