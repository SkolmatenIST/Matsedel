<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Veckans Matsedel</title>
    <style>
        /* DESIGN ANPASSAD FÖR TV- OCH INFOSKÄRMAR */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #2c3e50;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: #1a3a5f;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 5px solid #4a90e2;
            padding-bottom: 15px;
            width: 100%;
            text-align: center;
            font-weight: 700;
        }

        #matsedel-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .dag-kort {
            background: #fdfdfd;
            padding: 25px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            border-left: 8px solid #4a90e2;
            border-top: 1px solid #eee;
            border-right: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .dag-namn {
            font-size: 2.2rem;
            font-weight: bold;
            color: #1a3a5f;
            min-width: 220px;
            text-transform: capitalize;
        }

        .mat-text {
            font-size: 1.8rem;
            color: #444;
            line-height: 1.5;
            flex-grow: 1;
            font-weight: 500;
        }

        .laddar {
            font-size: 2rem;
            color: #7f8c8d;
            margin-top: 150px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>Veckans Matsedel</h1>
    <div id="matsedel-container">
        <div class="laddar">Hämtar matsedel...</div>
    </div>

    <script>
        // 1. KLISTRA IN DIN RSS-LÄNK FRÅN SKOLMATEN HÄR:
        const RSS_URL = 'https://skolmaten.se/api/4/rss/week/snosatraskolan?locale=sv';

        const dagarOrdning = ['måndag', 'tisdag', 'onsdag', 'torsdag', 'fredag'];

        // Vi använder AllOrigins öppna raw-api för att garanterat slippa bli blockade
        const proxyUrl = `https://allorigins.win{encodeURIComponent(RSS_URL)}`;

        fetch(proxyUrl)
            .then(response => {
                if (response.ok) return response.text();
                throw new Error('Nätverksfel beim hämtning.');
            })
            .then(str => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(str, "text/xml");
                const items = Array.from(xmlDoc.getElementsByTagName("item"));
                
                const container = document.getElementById('matsedel-container');
                container.innerHTML = ''; 

                // 1. SÄKER FILTRERING: Kontrollera att taggen finns innan vi kör textContent
                const arbetsdagar = items.filter(item => {
                    const titleTags = item.getElementsByTagName("title");
                    const titleText = titleTags.length > 0 ? titleTags[0].textContent.toLowerCase() : "";
                    return dagarOrdning.some(d => titleText.includes(d));
                });

                // 2. SÄKER SORTERING: Kontrollera att index [0] används överallt
                arbetsdagar.sort((a, b) => {
                    const tagA = a.getElementsByTagName("title");
                    const tagB = b.getElementsByTagName("title");
                    const titleA = tagA.length > 0 ? tagA[0].textContent.toLowerCase() : "";
                    const titleB = tagB.length > 0 ? tagB[0].textContent.toLowerCase() : "";
                    let indexA = dagarOrdning.findIndex(d => titleA.includes(d));
                    let indexB = dagarOrdning.findIndex(d => titleB.includes(d));
                    return indexA - indexB;
                });

                // 3. Spara max 5 arbetsdagar
                const veckansDagar = arbetsdagar.slice(0, 5);

                // 4. SÄKER UTMATNING: Bygg korten på skärmen
                veckansDagar.forEach(item => {
                    const titleTags = item.getElementsByTagName("title");
                    const rawTitle = titleTags.length > 0 ? titleTags[0].textContent : "";
                    
                    const descTags = item.getElementsByTagName("description");
                    const summaryTags = item.getElementsByTagName("summary");
                    let rawDesc = "Ingen meny registrerad";

                    if (descTags.length > 0) {
                        rawDesc = descTags[0].textContent;
                    } else if (summaryTags.length > 0) {
                        rawDesc = summaryTags[0].textContent;
                    }

                    // Tvätta bort HTML-skräp och radbrytningar
                    rawDesc = rawDesc.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();

                    const kort = document.createElement('div');
                    kort.className = 'dag-kort';

                    let rensadTitel = rawTitle;
                    dagarOrdning.forEach(d => {
                        if(rawTitle.toLowerCase().includes(d)) {
                            rensamTitel = d; // Ger ren text som "måndag"
                        }
                    });

                    // Tvinga stor begynnelsebokstav på veckodagen i HTML-strukturen
                    const formateradDag = rensadTitel.charAt(0).toUpperCase() + rensadTitel.slice(1);

                    kort.innerHTML = `
                        <div class="dag-namn">${formateradDag}</div>
                        <div class="mat-text">${rawDesc}</div>
                    `;
                    container.appendChild(kort);
                });

                if (veckansDagar.length === 0) {
                    container.innerHTML = `<div class="laddar">Hittade inga giltiga matsedelsdagar i flödet just nu.</div>`;
                }
            })
            .catch(err => {
                document.getElementById('matsedel-container').innerHTML = 
                    `<div class="laddar" style="color:#c0392b; font-weight:bold;">Kunde inte hämta matsedeln från Skolmaten för tillfället.</div>`;
                console.error(err);
            });
    </script>
</body>
</html>
